name: CoWork Claude review to GPT disposition (gated)

on:
  push:
    branches: [main]
    paths:
      - 'collab/reviews/**/REVIEW_RESULT_1.md'
      - 'collab/receipts/**/RECEIPT_1.md'
      - '.github/workflows/cowork-gpt-disposition.yml'
      - 'collab/tools/gpt_disposition_actions.py'
      - 'collab/tools/tests/test_gpt_disposition_actions.py'
      - 'collab/tools/gpt_disposition_telegram.py'
      - 'collab/tools/tests/test_gpt_disposition_telegram.py'
  workflow_dispatch:
    inputs:
      request_id:
        description: Existing completed review ID (no re-review)
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: cowork-gpt-disposition-main
  cancel-in-progress: false

jobs:
  offline-selftest:
    if: github.repository == 'wonhwipark/CoWork-Skill-Collab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout for no-model offline regression tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check parser and no-call budget safety offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile collab/tools/gpt_disposition_actions.py
          python3 -m unittest discover -s collab/tools/tests -v

  gpt-disposition:
    # No GPT API call until explicitly and separately authorized and configured.
    if: >-
      github.repository == 'wonhwipark/CoWork-Skill-Collab' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      vars.COWORK_GPT_API_ENABLED == 'true' &&
      vars.COWORK_GPT_COST_POLICY_APPROVED == 'true' &&
      vars.COWORK_GPT_PROJECT_SPEND_CAP_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main with source-pin history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Ed25519 verification dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .cowork-venv
          .cowork-venv/bin/python -m pip install --disable-pip-version-check 'cryptography>=45,<47'
      - name: Verify immutable review chain, claim once, call GPT API, publish create-only
        id: disposition
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          COWORK_GPT_API_ENABLED: ${{ vars.COWORK_GPT_API_ENABLED }}
          COWORK_GPT_COST_POLICY_APPROVED: ${{ vars.COWORK_GPT_COST_POLICY_APPROVED }}
          COWORK_GPT_MODEL: ${{ vars.COWORK_GPT_MODEL }}
          COWORK_GPT_MAX_CALL_USD: ${{ vars.COWORK_GPT_MAX_CALL_USD }}
          COWORK_GPT_INPUT_RATE_USD_PER_1M: ${{ vars.COWORK_GPT_INPUT_RATE_USD_PER_1M }}
          COWORK_GPT_OUTPUT_RATE_USD_PER_1M: ${{ vars.COWORK_GPT_OUTPUT_RATE_USD_PER_1M }}
          COWORK_GPT_PROJECT_SPEND_CAP_CONFIRMED: ${{ vars.COWORK_GPT_PROJECT_SPEND_CAP_CONFIRMED }}
          COWORK_APPROVER_PUBLIC_KEY_B64: ${{ vars.COWORK_APPROVER_PUBLIC_KEY_B64 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUEST_ID" ]; then
            .cowork-venv/bin/python collab/tools/gpt_disposition_actions.py --request-id "$REQUEST_ID"
          else
            .cowork-venv/bin/python collab/tools/gpt_disposition_actions.py --before "$PUSH_BEFORE" --after "$PUSH_AFTER"
          fi

      - name: Send one Telegram message only after verified GPT disposition (optional)
        if: >-
          steps.disposition.outputs.posted_request_id != '' &&
          vars.COWORK_GPT_TELEGRAM_NOTIFY_ENABLED == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          COWORK_GPT_TELEGRAM_NOTIFY_ENABLED: ${{ vars.COWORK_GPT_TELEGRAM_NOTIFY_ENABLED }}
          COWORK_TELEGRAM_BOT_TOKEN: ${{ secrets.COWORK_TELEGRAM_BOT_TOKEN }}
          COWORK_TELEGRAM_CHAT_ID: ${{ secrets.COWORK_TELEGRAM_CHAT_ID }}
          POSTED_REQUEST_ID: ${{ steps.disposition.outputs.posted_request_id }}
        run: |
          set -euo pipefail
          python3 collab/tools/gpt_disposition_telegram.py --request-id "$POSTED_REQUEST_ID"
