name: MSC final ZIP release safety and compatibility (isolated)
on:
  push:
    branches: [msc-skill-validation-20261116]
    paths:
      - .github/workflows/msc-public-final-release-check-20261116.yml
      - collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/build_msc_public_release.py
      - collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/validate_msc_release_runtime.py
      - collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/validate_msc_full_regression.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      MSC_RELEASE_OUTPUT_DIR: collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/release-ready
    steps:
      - name: Checkout synthetic QA on isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout pinned PRIVATE main development ZIP inputs separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: pinned-input
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare exact SHA-pinned development source ZIPs
        run: |
          set -euo pipefail
          cp pinned-input/collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/{doc-converter_v0_2_24_1116.zip,work-ledger-kernel_v0_7_41_1116.zip} collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/
      - name: Build versioned PUBLIC-delivery ZIPs with complete hash indexes
        run: |
          set -euo pipefail
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/build_msc_public_release.py
      - name: Install only standalone pytest harness
        run: python -m pip install --quiet pytest
      - name: Full packaged regression and release ZIP safety scan
        run: |
          set -euo pipefail
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/validate_msc_full_regression.py
      - name: Actual Kernel Work evidence export and direct OpenCode converter CLI
        run: |
          set -euo pipefail
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/validate_msc_release_runtime.py
  export:
    needs: validate
    if: github.repository == 'wonhwipark/CoWork-Skill-Collab' && github.ref == 'refs/heads/msc-skill-validation-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      MSC_RELEASE_OUTPUT_DIR: collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/release-ready
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: pinned-input
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Rebuild deterministic release bytes, never install
        run: |
          set -euo pipefail
          cp pinned-input/collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/{doc-converter_v0_2_24_1116.zip,work-ledger-kernel_v0_7_41_1116.zip} collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/build_msc_public_release.py
      - name: Export verified ZIP bytes for GPT publisher after all QA PASS
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['MSC_RELEASE_OUTPUT_DIR'])
          manifest=json.loads((root/'release_manifest.json').read_text(encoding='utf-8'))
          for row in manifest['candidates']:
              data=(root/row['filename']).read_bytes()
              assert len(data)==row['size'] and hashlib.sha256(data).hexdigest()==row['sha256']
              with zipfile.ZipFile(root/row['filename']) as z:
                  assert z.testzip() is None
              print('MSC_FINAL_BEGIN',row['filename'],str(row['size']),row['sha256'],flush=True)
              print('MSC_FINAL_B64',base64.b64encode(data).decode('ascii'),flush=True)
              print('MSC_FINAL_END',row['filename'],flush=True)
          PY
