name: MSC PUBLIC release full regression (read only)
on:
  push:
    branches: [msc-skill-validation-20261116]
    paths:
      - .github/workflows/msc-release-full-regression-20261116.yml
      - collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/validate_msc_full_regression.py
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Isolated QA scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Actual pinned candidate ZIPs from PRIVATE main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: pinned-input
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only pytest (no skill installation)
        run: python -m pip install --quiet pytest
      - name: Full package test corpus, ZIP safety and secret scan
        run: |
          set -euo pipefail
          cp pinned-input/collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/{doc-converter_v0_2_24_1116.zip,work-ledger-kernel_v0_7_41_1116.zip} collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/validate_msc_full_regression.py
