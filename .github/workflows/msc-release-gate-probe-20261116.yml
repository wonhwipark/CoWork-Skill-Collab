name: MSC PUBLIC release gate probe (read only)
on:
  push:
    branches: [msc-skill-validation-20261116]
    paths:
      - .github/workflows/msc-release-gate-probe-20261116.yml
      - collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/probe_release_api.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: input
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Probe skill direct OpenCode and Kernel API on pinned inputs
        run: |
          set -euo pipefail
          cp input/collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/{doc-converter_v0_2_24_1116.zip,work-ledger-kernel_v0_7_41_1116.zip} collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/tests/probe_release_api.py
