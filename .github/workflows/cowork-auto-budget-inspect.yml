name: Inspect cost-only watcher policy source (read only)
on:
  push:
    branches: [dev/auto-review-budget-policy-20261117]
    paths: ['.github/workflows/cowork-auto-budget-inspect.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect pinned v0.2.24, no model or host operations
        run: |
          python - <<'PY'
          import ast,zipfile,re
          zpath='collab/projects/COWORK-AUTO-APPROVAL-20261115-001/candidates/skill-collab-watcher_v0_2_24_1117.zip'
          with zipfile.ZipFile(zpath) as z:
              print('ZIP_CRC',z.testzip())
              for name in ('skill_collab_watcher/auto_policy.py','skill_collab_watcher/auto_approval.py','skill_collab_watcher/state_store.py','skill_collab_watcher/validator.py','skill_collab_watcher/review_runner.py','tests/test_auto_approval.py'):
                  lines=z.read(name).decode('utf8').splitlines()
                  print('MODULE',name,'LINES',len(lines))
                  if name.endswith('auto_policy.py'):
                      for i in range(0,min(len(lines),155)):print(f'SRC {name} {i+1} {lines[i]}')
                  elif name.endswith('auto_approval.py'):
                      for i,l in enumerate(lines):
                          if any(t in l for t in ('max_request_usd','max_day_usd','max_month_usd','run_policy_ref','max_budget_usd','auto_claim(','run_budgets','Delegation','max_request_cents','max_day_cents','max_month_cents','max_day_calls','policy_ref')):
                              for j in range(max(0,i-4),min(len(lines),i+6)):print(f'SRC {name} {j+1} {lines[j]}')
                  elif name.endswith('state_store.py'):
                      for i,l in enumerate(lines):
                          if any(t in l for t in ('def _auto_usage_locked','def auto_claim(','day_cents','month_cents','max_day_cents','max_month_cents','reserved_cents','cost_usd','used_cents')):
                              for j in range(max(0,i-2),min(len(lines),i+5)):print(f'SRC {name} {j+1} {lines[j]}')
                  elif name.endswith('validator.py'):
                      for i,l in enumerate(lines):
                          if any(t in l for t in ('run_policy_ref','run_budgets','budget','max_budget','RUN_POLICY')):
                              for j in range(max(0,i-3),min(len(lines),i+5)):print(f'SRC {name} {j+1} {lines[j]}')
                  elif name.endswith('review_runner.py'):
                      for i,l in enumerate(lines):
                          if any(t in l for t in ('max_budget_usd','run_policy_ref','budget_usd','--max-budget')):
                              for j in range(max(0,i-2),min(len(lines),i+4)):print(f'SRC {name} {j+1} {lines[j]}')
                  else:
                      for i,l in enumerate(lines):
                          if any(t in l for t in ('max_request','max_day','max_month','run_policy_ref','POLICY-STATIC','DAY_COST_LIMIT','MONTH_COST_LIMIT')):
                              print(f'SRC {name} {i+1} {l}')
          PY
