name: Audit public Skill-Updater v0.5.44 job-list activation behavior
on:
  push:
    paths:
      - .github/workflows/audit-skill-updater-v0544-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect_public_zip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned public archive without running the updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, hashlib, io, re, sys, urllib.request, zipfile, pathlib
          url="https://raw.githubusercontent.com/wonhwipark/L1Work/main/skill-updater_v0_5_44_1027.zip"
          data=urllib.request.urlopen(url,timeout=55).read()
          blob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          assert len(data)==210717,(len(data), "SIZE")
          assert blob=="d83faa021549835a40e3ddc134b8e936dc962e65",(blob,"BLOB_MISMATCH")
          z=zipfile.ZipFile(io.BytesIO(data))
          assert z.testzip() is None
          paths=[n for n in z.namelist() if not n.endswith("/")]
          assert len(paths)==len(set(paths))
          for n in paths:
              assert ".." not in pathlib.PurePosixPath(n).parts
          needle=re.compile(r"job.?list|job_sync|post.update|activate|launch|subprocess|Popen|wait\(|returncode|timeout|wait_job|worker|version_changed",re.I)
          root="collab/projects/SKILL-UPDATER-JOBLIST-LATENCY-20261115-001"
          out=pathlib.Path(root)/"STATIC_AUDIT_v0544.md"
          out.parent.mkdir(parents=True,exist_ok=True)
          lines=[
            "# Skill-Updater v0.5.44 — isolated public ZIP code audit",
            "- Source: `wonhwipark/L1Work/main/skill-updater_v0_5_44_1027.zip`",
            "- Source size: "+str(len(data)),
            "- Source SHA-256: `"+hashlib.sha256(data).hexdigest()+"`",
            "- Git blob SHA: `"+blob+"`",
            "- ZIP CRC: PASS",
            "- Scope: STATIC source inspection; not the currently installed Linux binary. Never ran updater, activated Jobs or touched host.",
            "- Source files: "+str(len(paths)),
            "",
          ]
          pyfiles=[n for n in paths if n.endswith(".py") and ("skill_updater" in n or "bootstrap" in n or "job" in n or "mcp" in n)]
          for n in pyfiles[:25]:
              raw=z.read(n)
              try: source=raw.decode("utf-8")
              except UnicodeDecodeError: continue
              src=source.splitlines()
              hits=[i for i,l in enumerate(src) if needle.search(l)]
              if not hits: continue
              lines+=["## `"+n+"`", "- total lines: "+str(len(src)), "- matching lines: "+str(len(hits))]
              try:
                  tree=ast.parse(source)
                  nodes=[node for node in ast.walk(tree) if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and needle.search(node.name)]
                  lines.append("- related functions: "+", ".join(f"`{node.name}` at {node.lineno}–{node.end_lineno}" for node in nodes[:30]))
              except SyntaxError as exc:
                  lines.append("- AST parse: "+str(exc))
                  nodes=[]
              zones=set()
              for i in hits[:130]:
                  for j in range(max(i-5,0),min(i+7,len(src))): zones.add(j)
              for node in nodes:
                  if node.end_lineno-node.lineno<90:
                      for j in range(node.lineno-1,node.end_lineno): zones.add(j)
              excerpt=[]
              last=-2
              for i in sorted(zones):
                  if i!=last+1: excerpt.append("...")
                  if len(src[i])>260: excerpt.append(f"{i+1:05d}: "+src[i][:260]+" ...[TRUNCATED]")
                  else: excerpt.append(f"{i+1:05d}: "+src[i])
                  last=i
              excerpt=excerpt[:570]
              lines+=["```python",*excerpt,"```",""]
          if len(lines)<12: raise RuntimeError("NO_RELEVANT_SOURCE_EXTRACTED")
          out.write_text("\n".join(lines)+"\n")
          print("AUDIT_PATH",out)
          print("MATCHED_PUBLIC_PY_FILES",len(pyfiles))
          print("REPORT_CHARS",out.stat().st_size)
          PY
      - name: Extract exact v0.5.44 updater dispatch and GitHub root-ZIP decision code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,zipfile,urllib.request,ast,re,pathlib
          z=zipfile.ZipFile(io.BytesIO(urllib.request.urlopen("https://raw.githubusercontent.com/wonhwipark/L1Work/main/skill-updater_v0_5_44_1027.zip",timeout=55).read()))
          base="skill-updater_v0_5_44_1027/"
          names=["scripts/skill_updater.py","scripts/skill_updater_auto.py"]
          out=["# Skill-Updater v0.5.44 dispatch and discovery — exact source excerpts","","- Public ZIP; static audit only, not Linux installed files",""]
          regex=re.compile(r"root.?zip|github.*cache|github.*listing|github_min_poll|job_list|joblist|activate|source.*github|force.*refresh|refresh.*remote|remote.*version|def main\\(|def update\\(",re.I)
          for name in names:
              src=z.read(base+name).decode('utf8').splitlines()
              tree=ast.parse("\n".join(src))
              matches=[]
              for node in ast.walk(tree):
                  if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)): continue
                  low=node.name.lower()
                  if ('job_list' in low or 'github' in low or 'root_zip' in low or 'discover' in low or 'cache' in low or 'remote' in low or low in ('main','update')):
                      matches.append(node)
              out+=["## "+name, "Source functions of interest: "+", ".join(n.name+":"+str(n.lineno) for n in matches[:100]),""]
              intervals=[]
              for i,line in enumerate(src):
                  if regex.search(line):
                      intervals.append((max(0,i-4),min(len(src),i+9)))
              for node in matches:
                  if node.name in ('run_job_list_post_update','github_contents_listing','github_contents_bytes','main','_job_list_version_changed','discover_remote','discover_public_zips','list_remote_assets') or 'root_zip' in node.name:
                      intervals.append((node.lineno-1,min(len(src),node.end_lineno)))
              used=set()
              for a,b in intervals: used.update(range(a,b))
              if name.endswith('skill_updater.py'):
                  # Keep focus on discovery, CLI invocation and activation.
                  used={i for i in used if (i<1500 or i>4200) or any(abs(i-(n.lineno-1))<100 for n in matches if 'github' in n.name)}
              ix=sorted(used)
              if len(ix)>1350: ix=ix[:1350]
              last=-2
              out.append('\\x60\\x60\\x60python'.replace('\\x60','`'))
              for i in ix:
                  if i!=last+1:out.append('...')
                  out.append(f'{i+1:05d}: {src[i].rstrip()}')
                  last=i
              out.append('\\x60\\x60\\x60'.replace('\\x60','`'))
          p=pathlib.Path("collab/projects/SKILL-UPDATER-JOBLIST-LATENCY-20261115-001/FOCUSED_AUDIT_v0544.md")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text("\n".join(out).rstrip()+"\n",encoding='utf8')
          print('FOCUSED_REPORT',p,p.stat().st_size)
          PY
      - name: Commit isolated static report to PRIVATE
        shell: bash
        run: |
          set -euo pipefail
          REPORT="collab/projects/SKILL-UPDATER-JOBLIST-LATENCY-20261115-001/STATIC_AUDIT_v0544.md"
          test -s "$REPORT"
          test -s "collab/projects/SKILL-UPDATER-JOBLIST-LATENCY-20261115-001/FOCUSED_AUDIT_v0544.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Source excerpts may include trailing spaces; strip them from report only.
          sed -i 's/[[:blank:]]*$//' "$REPORT"
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text(encoding="utf-8").rstrip()+"\\n",encoding="utf-8")' "$REPORT"
          git add -- "$REPORT" "collab/projects/SKILL-UPDATER-JOBLIST-LATENCY-20261115-001/FOCUSED_AUDIT_v0544.md"
          git diff --cached --check
          git commit -m 'audit(skill-updater): inspect public v0.5.44 activate/wait boundaries'
          git push origin HEAD:main
