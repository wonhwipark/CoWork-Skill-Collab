name: CLPR isolated Work Evidence contract inspection
on:
  push:
    branches: [clpr-e2-work-evidence-20261115]
    paths: [.github/workflows/clpr-e2-contract-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'wonhwipark/CoWork-Skill-Collab' && github.ref == 'refs/heads/clpr-e2-work-evidence-20261115'
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Inspect only public-contract AST and registry names, no source or secrets emitted
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python - <<'PY'
          import ast, hashlib, pathlib, zipfile, json
          base=pathlib.Path('collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates')
          targets=[
            ('workflow','l1-fix-workflow_v1_6_68_1114.zip','046b7968ff552d590a72c4e7ebb0a29df6760b5a6d07196f17f6eef09770e31a'),
            ('kernel','work-ledger-kernel_v0_7_38_1114.zip','6797f509d005377f9ba0d6312cc6cfb7017c7502cfcaab3ee61332c7f0a6e788'),
          ]
          needles=('reference_add','context_event','record_evidence','existing_work','plan_clpr','work_id','evidence','cli_main')
          for label, filename, expected in targets:
            raw=(base/filename).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==expected
            print('ARCHIVE_SHA_PASS',label,len(raw))
            with zipfile.ZipFile(base/filename) as z:
              matches=0
              for name in z.namelist():
                if not name.endswith('.py'):continue
                try: tree=ast.parse(z.read(name),filename=name)
                except SyntaxError:continue
                for n in ast.walk(tree):
                  if not isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                  if not any(x in n.name.lower() for x in needles):continue
                  # Only signatures and callee names, never source text, string literals or credentials
                  args=[a.arg for a in n.args.posonlyargs+n.args.args+n.args.kwonlyargs]
                  if n.args.vararg:args.append('*'+n.args.vararg.arg)
                  if n.args.kwarg:args.append('**'+n.args.kwarg.arg)
                  calls=sorted({c.func.id if isinstance(c.func,ast.Name) else c.func.attr if isinstance(c.func,ast.Attribute) else '?' for c in ast.walk(n) if isinstance(c,ast.Call)})[:38]
                  print('API',label,name,n.name,'args=',','.join(args),'calls=',','.join(calls))
                  matches+=1
              print('API_COUNT',label,matches)
              print('TEST_FILES',label,json.dumps([n for n in z.namelist() if n.endswith('.py') and '/tests/' in n and any(t in n.lower() for t in ('evidence','reference','workflow','clpr'))][:25]))
          print('INSPECTION_COMPLETE_NO_WORKSPACE_WRITES')
          PY
      - name: Inspect narrowly scoped Work and CLPR linking implementation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib, zipfile
          base=pathlib.Path('collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates')
          cfg=[
            ('l1-fix-workflow_v1_6_68_1114.zip',('issue_brief.py', 'cli.py'),('plan_clpr_issue_cases','lookup_clpr_existing_work','_clpr_ref')),
            ('work-ledger-kernel_v0_7_38_1114.zip',('kernel.py','work_refs.py','work_references.py'),('work_reference_add','work_reference_find','work_create','_work_refs')),
          ]
          for filename, suffixes, targets in cfg:
            with zipfile.ZipFile(base/filename) as z:
              for name in z.namelist():
                if not name.endswith(suffixes):continue
                src=z.read(name).decode('utf-8-sig')
                try: tree=ast.parse(src)
                except SyntaxError:continue
                lines=src.splitlines()
                for node in ast.walk(tree):
                  if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                  if node.name not in targets:continue
                  lim=min(node.end_lineno or node.lineno,node.lineno+110)
                  print('SOURCE_BEGIN',filename,name,node.name,node.lineno,lim)
                  for no in range(node.lineno,lim+1):
                    print(f'{no:04d}: '+lines[no-1][:180])
                  print('SOURCE_END',node.name)
          PY
      - name: Inspect WorkReference add and find guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib, zipfile
          p=pathlib.Path('collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/work-ledger-kernel_v0_7_38_1114.zip')
          with zipfile.ZipFile(p) as z:
            for name in z.namelist():
              if name not in ('work_ledger_kernel/work_refs.py','work_ledger_kernel/kernel.py'):continue
              lines=z.read(name).decode('utf-8-sig').splitlines()
              tree=ast.parse('\n'.join(lines))
              for node in ast.walk(tree):
                if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
                if node.name not in ('add','find','__init__','work_reference_find'):continue
                if node.name=='__init__' and name.endswith('work_refs.py'):continue
                lim=min(node.end_lineno or node.lineno,node.lineno+115)
                print('REF_API_BEGIN',name,node.name,node.lineno,lim)
                for num in range(node.lineno,lim+1): print(f'{num:04d}: '+lines[num-1][:180])
                print('REF_API_END',node.name)
          PY
      - name: Run synthetic Work reference patch in temp-only ledger
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export CLPR_TEMP="${RUNNER_TEMP}/clpr-work-e2"
          mkdir -p "$CLPR_TEMP"
          python - <<'PY'
          import pathlib,zipfile,os
          base=pathlib.Path("collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates")
          dest=pathlib.Path(os.environ["CLPR_TEMP"])
          for archive, sub in [('l1-fix-workflow_v1_6_68_1114.zip','workflow'),('work-ledger-kernel_v0_7_38_1114.zip','kernel')]:
            with zipfile.ZipFile(base/archive) as z: z.extractall(dest/sub)
          PY
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/devtools/apply_kernel_ref_find_patch.py "$CLPR_TEMP/kernel/work_ledger_kernel/kernel.py"
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/devtools/apply_workflow_cli_patch.py "$CLPR_TEMP/workflow/l1-fix-workflow/l1_fix_workflow/cli.py"
          cp collab/projects/L1-WORKSPACE-RAG-20261111-001/devtools/clpr_existing_work_link.py "$CLPR_TEMP/workflow/l1-fix-workflow/l1_fix_workflow/clpr_existing_work_link.py"
          export PYTHONPATH="$CLPR_TEMP/workflow/l1-fix-workflow:$CLPR_TEMP/kernel"
          python -m unittest -v collab/projects/L1-WORKSPACE-RAG-20261111-001/devtools/test_clpr_existing_work_link.py
          echo "CLPR_WORK_REFS_SYNTHETIC_E2_PASS (no host/production writes)"
          python - <<'PY'
          from l1_fix_workflow.cli import parser
          p=parser()
          a=p.parse_args(['clpr-existing-work-link','--input-json','/tmp/example.json','--issue-identity','jira:SOC-321'])
          assert a.commit is False and a.issue_identity=='jira:SOC-321'
          b=p.parse_args(['clpr-existing-work-link','--input-json','/tmp/example.json','--issue-identity','jira:SOC-321','--commit'])
          assert b.commit is True
          print('CLPR_CLI_PREVIEW_DEFAULT_AND_EXPLICIT_COMMIT_PARSE_PASS')
          PY
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/devtools/build_clpr_dev_candidates.py
          echo "CLPR_CANDIDATE_PACKAGED_NOT_FOR_DEPLOYMENT"
      - name: Inspect packaging metadata schemas only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,zipfile
          base=pathlib.Path('collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates')
          for fn in ('l1-fix-workflow_v1_6_68_1114.zip','work-ledger-kernel_v0_7_38_1114.zip'):
            with zipfile.ZipFile(base/fn) as z:
              names=[n for n in z.namelist() if n.endswith(('MANIFEST_SHA256.json','.skill-release.json','VERSION','VERSION.txt'))]
              print('META_NAMES',fn,names)
              for n in names:
                try:
                  obj=json.loads(z.read(n))
                  if isinstance(obj,dict):
                    print('META_DICT',n,[(key,type(value).__name__,len(value) if isinstance(value,(dict,list,str)) else 0) for key,value in obj.items()][:16])
                    for key,val in obj.items():
                      if isinstance(val,dict):
                        print('META_CHILD',n,key,list(val.keys())[:8],str(next(iter(val.items()),''))[:150])
                      if isinstance(val,list):
                        print('META_ARRAY',n,key,str(val[:2])[:250])
                  else: print('META_OTHER',n,type(obj).__name__)
                except (ValueError,UnicodeDecodeError):
                  print('META_TEXT',n,z.read(n)[:250].decode('utf-8','replace'))
          PY
      - name: Inspect CLI CLPR hook location only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,zipfile
          base=pathlib.Path("collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/l1-fix-workflow_v1_6_68_1114.zip")
          with zipfile.ZipFile(base) as z:
            for name in z.namelist():
              if name.endswith("/l1_fix_workflow/cli.py"):
                lines=z.read(name).decode("utf-8").splitlines()
                ix=[i for i,line in enumerate(lines) if "clpr-issue-plan" in line or "lookup_clpr_existing_work" in line]
                for i in ix[:12]:
                  print("CLI_HOOK",name,i+1)
                  for j in range(max(0,i-12),min(len(lines),i+22)):
                    print(str(j+1)+": "+lines[j][:180])
          PY
      - name: Store development-only ZIPs as private Actions artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clpr-development-only-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/clpr-work-e2/dev-output/*.zip
          if-no-files-found: error
          retention-days: 7
