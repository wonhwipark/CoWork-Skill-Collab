name: CoWork PRIVATE dashboard (read-only inputs)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cowork-dashboard.yml'
      - 'collab/dashboard/*.py'
      - 'collab/dashboard/tests/**'
      - 'collab/dashboard/public_preview/**'
      - 'collab/projects/**/CURRENT.md'
      - 'collab/projects/**/TRACKER.json'
      - 'collab/requests/**'
      - 'collab/reviews/**'
      - 'collab/receipts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cowork-private-dashboard-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'wonhwipark/CoWork-Skill-Collab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout only authorized PRIVATE repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Build and test without external API or dependencies
        run: |
          python3 -m unittest discover -s collab/dashboard/tests -v
          python3 -m unittest discover -s collab/dashboard/public_preview/tests -v
          python3 collab/dashboard/public_preview/build.py
          python3 collab/dashboard/generate.py
          python3 -m json.tool collab/dashboard/state.json >/dev/null
      - name: Publish only dashboard artifacts back to PRIVATE main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -- collab/dashboard/index.html collab/dashboard/SUMMARY.md collab/dashboard/state.json collab/dashboard/VIEW.md collab/dashboard/public_preview/index.html
          if git diff --cached --quiet; then
            echo 'UNCHANGED: no commit needed'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(dashboard): refresh GitHub SHADOW view [skip ci]'
          # No forced push. Concurrent changes fail closed; manually rerun the workflow.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/main
