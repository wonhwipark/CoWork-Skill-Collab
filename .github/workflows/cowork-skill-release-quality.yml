name: CoWork skill release quality gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cowork-skill-release-quality.yml'
      - 'collab/ops/CONTRACTS/MSC_SKILL_IO_MATRIX_V1.json'
      - 'collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/*.py'
      - 'collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/*.zip'
      - 'collab/projects/COWORK-SKILL-DISCOVERY-20261112-001/dev/*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Executable release and MSC contract negative cases
        run: |
          python -m unittest discover -v -s collab/projects/L1-WORKSPACE-RAG-20261111-001/dev -p 'test_*gate.py'
      - name: Actual Kernel SVG Evidence export regressions
        env:
          KERNEL_TEST_ARCHIVE: collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/work-ledger-kernel_v0_7_43_1117.zip
        run: |
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/test_kernel_export_svg_evidence.py
      - name: Build pinned Kernel Work-root MSC HTML link development candidate
        run: |
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/build_msc_kernel_html_links_r0001_20261118.py --source collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/work-ledger-kernel_v0_7_43_1117.zip --out /tmp/msc-dual-entry-development
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/build_msc_kernel_html_links_r0001_20261118.py --source collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/work-ledger-kernel_v0_7_43_1117.zip --out /tmp/msc-dual-entry-recheck
          cmp /tmp/msc-dual-entry-development/work-ledger-kernel_v0_7_45_1118.zip /tmp/msc-dual-entry-recheck/work-ledger-kernel_v0_7_45_1118.zip
          echo REPRODUCIBLE_KERNEL_ZIP_PASS
      - name: Synthetic Kernel HTML Evidence writer probe (candidate and preservation)
        env:
          KERNEL_TEST_ARCHIVE: /tmp/msc-dual-entry-development/work-ledger-kernel_v0_7_45_1118.zip
        run: |
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/test_msc_dual_entry_kernel_writer_probe.py
      - name: Existing public converter immutable release and action policy
        run: |
          curl --fail --location --retry 3 --silent --show-error -o /tmp/doc-converter_v0_2_26_1117.zip https://raw.githubusercontent.com/wonhwipark/L1Work/main/doc-converter_v0_2_26_1117.zip
          echo 'b0ebd0aa4d771adc30648ab2bce23a3c1648e408984bedb36d0e3da45108312c  /tmp/doc-converter_v0_2_26_1117.zip' | sha256sum --check
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/skill_release_quality_gate.py --zip /tmp/doc-converter_v0_2_26_1117.zip --expected-version 0.2.26
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/msc_skill_contract_gate.py --matrix collab/ops/CONTRACTS/MSC_SKILL_IO_MATRIX_V1.json --package /tmp/doc-converter_v0_2_26_1117.zip --require-policy
      - name: Build and regression-test pinned dual-entry development candidates
        run: |
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/msc_dual_entry_candidate.py --converter /tmp/doc-converter_v0_2_26_1117.zip --workflow collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/l1-fix-workflow_v1_6_70_1117.zip --out /tmp/msc-dual-entry-development
          python collab/projects/L1-WORKSPACE-RAG-20261111-001/dev/msc_dual_entry_candidate.py --converter /tmp/doc-converter_v0_2_26_1117.zip --workflow collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/l1-fix-workflow_v1_6_70_1117.zip --out /tmp/msc-dual-entry-recheck
          cmp /tmp/msc-dual-entry-development/doc-converter_v0_2_28_1118.zip /tmp/msc-dual-entry-recheck/doc-converter_v0_2_28_1118.zip
          cmp /tmp/msc-dual-entry-development/l1-fix-workflow_v1_6_72_1118.zip /tmp/msc-dual-entry-recheck/l1-fix-workflow_v1_6_72_1118.zip
          echo REPRODUCIBLE_CONVERTER_WORKFLOW_ZIPS_PASS
      - name: Inspect two pinned existing PEC and ACE skill interfaces (read-only)
        run: |
          python collab/projects/COWORK-SKILL-DISCOVERY-20261112-001/dev/inspect_existing_pec_ace_interfaces_r0001.py
      - name: Build pinned PEC Code Analyzer and ACE Workflow two-skill candidates
        run: |
          sha256sum collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/code-analyzer_v0_15_3_1114.zip
          python collab/projects/COWORK-SKILL-DISCOVERY-20261112-001/dev/build_pec_ace_two_skills_v1_1119.py --out /tmp/pec-ace-two-skill-development
          python collab/projects/COWORK-SKILL-DISCOVERY-20261112-001/dev/build_pec_ace_two_skills_v1_1119.py --out /tmp/pec-ace-two-skill-recheck
          cmp /tmp/pec-ace-two-skill-development/code-analyzer_v0_15_4_1119.zip /tmp/pec-ace-two-skill-recheck/code-analyzer_v0_15_4_1119.zip
          cmp /tmp/pec-ace-two-skill-development/l1-fix-workflow_v1_6_74_1119.zip /tmp/pec-ace-two-skill-recheck/l1-fix-workflow_v1_6_74_1119.zip
          echo PEC_ACE_TWO_SKILL_DEVELOPMENT_REPRO_PASS
      - name: Preserve PEC and ACE two-skill developer packages only
        uses: actions/upload-artifact@v4
        with:
          name: pec-ace-two-skill-development-1119
          path: /tmp/pec-ace-two-skill-development/*
          retention-days: 7
          if-no-files-found: error
      - name: Build ACE PEC ACON packaged Workflow read-only development candidate
        run: |
          python collab/projects/COWORK-SKILL-DISCOVERY-20261112-001/dev/build_ace_pec_acon_workflow_v1673_1119.py --out /tmp/ace-pec-acon-development
          python collab/projects/COWORK-SKILL-DISCOVERY-20261112-001/dev/build_ace_pec_acon_workflow_v1673_1119.py --out /tmp/ace-pec-acon-recheck
          cmp /tmp/ace-pec-acon-development/l1-fix-workflow_v1_6_73_1119.zip /tmp/ace-pec-acon-recheck/l1-fix-workflow_v1_6_73_1119.zip
          echo ACE_PEC_ACON_WORKFLOW_REPRODUCIBLE_DEV_ONLY_PASS
      - name: Preserve verified ACE PEC ACON development package (not PUBLIC release)
        uses: actions/upload-artifact@v4
        with:
          name: ace-pec-acon-workflow-development-1119
          path: /tmp/ace-pec-acon-development/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve verified development candidates (not PUBLIC release)
        uses: actions/upload-artifact@v4
        with:
          name: msc-dual-entry-development-1118
          path: /tmp/msc-dual-entry-development/*
          if-no-files-found: error
          retention-days: 7
      - name: Fail closed for changed candidate skill ZIPs in this commit
        run: |
          python - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'collab/projects/L1-WORKSPACE-RAG-20261111-001/dev')
          from skill_release_quality_gate import validate
          cp=subprocess.run(['git','diff','--name-only','HEAD^','HEAD'],text=True,capture_output=True,check=True)
          count=0
          for raw in cp.stdout.splitlines():
              if not raw.startswith('collab/projects/L1-WORKSPACE-RAG-20261111-001/candidates/'):
                  continue
              m=re.search(r'_v(\d+)_(\d+)_(\d+)_\d{4}\.zip$',raw)
              if not m:
                  continue
              p=Path(raw)
              if p.is_file():
                  expected='.'.join(m.groups())
                  print('CHANGED_CANDIDATE_GATE',validate(p,expected))
                  count+=1
          print('CHANGED_CANDIDATE_CHECKED',count)
          PY
